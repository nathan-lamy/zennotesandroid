name: Build Android APK

on:
  workflow_dispatch: {}
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    # actions/checkout refuses any path outside $GITHUB_WORKSPACE, so we can't
    # force an absolute root. Instead, nest both checkouts as siblings under a
    # subfolder of the workspace - that keeps '../../opensource/zennotes'
    # (resolved from zennotesandroid/src) pointing at the right place.
    steps:
      - name: Checkout zennotesandroid
        uses: actions/checkout@v4
        with:
          path: build/zennotesandroid

      - name: Checkout zennotes monorepo (sibling dependency)
        uses: actions/checkout@v4
        with:
          repository: ZenNotes/zennotes
          path: build/opensource/zennotes
          # If this repo is ever made private, uncomment and add a PAT secret:
          # token: ${{ secrets.ZENNOTES_MONOREPO_TOKEN }}

      - name: Debug - show resolved layout
        run: |
          echo "--- workspace/build ---"
          ls -la "$GITHUB_WORKSPACE/build"
          echo "--- zennotesandroid/src ---"
          ls -la "$GITHUB_WORKSPACE/build/zennotesandroid/src" || true
          echo "--- opensource/zennotes/packages/app-core/src ---"
          ls -la "$GITHUB_WORKSPACE/build/opensource/zennotes/packages/app-core/src" || true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: build/zennotesandroid/package-lock.json

      - name: Install dependencies
        working-directory: build/zennotesandroid
        run: npm install

      - name: Vite build + Capacitor sync
        working-directory: build/zennotesandroid
        run: npm run sync

      - name: Make gradlew executable
        working-directory: build/zennotesandroid/android
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: build/zennotesandroid/android
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: zennotes-debug-apk
          path: build/zennotesandroid/android/app/build/outputs/apk/debug/app-debug.apk
