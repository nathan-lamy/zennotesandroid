name: Build Android APK

on:
  workflow_dispatch: {}
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    # actions/checkout refuses any path outside $GITHUB_WORKSPACE.
    # The Vite alias '../../opensource/zennotes' is resolved relative to
    # vite.config.ts at the zennotesandroid repo ROOT (confirmed from build
    # logs), not from src/. So: zennotesandroid lives at build/zennotesandroid,
    # two levels up from that is $GITHUB_WORKSPACE itself, and opensource/zennotes
    # must sit directly there.
    steps:
      - name: Checkout zennotesandroid
        uses: actions/checkout@v4
        with:
          path: build/zennotesandroid

      - name: Checkout zennotes monorepo (sibling dependency)
        uses: actions/checkout@v4
        with:
          repository: ZenNotes/zennotes
          path: opensource/zennotes
          # If this repo is ever made private, uncomment and add a PAT secret:
          # token: ${{ secrets.ZENNOTES_MONOREPO_TOKEN }}

      - name: Debug - show resolved layout
        run: |
          echo "--- workspace root ---"
          ls -la "$GITHUB_WORKSPACE"
          echo "--- zennotesandroid/src ---"
          ls -la "$GITHUB_WORKSPACE/build/zennotesandroid/src" || true
          echo "--- opensource/zennotes (top level) ---"
          ls -la "$GITHUB_WORKSPACE/opensource/zennotes" || true
          echo "--- opensource/zennotes/packages ---"
          ls -la "$GITHUB_WORKSPACE/opensource/zennotes/packages" || true
          echo "--- opensource/zennotes/packages/app-core/src ---"
          ls -la "$GITHUB_WORKSPACE/opensource/zennotes/packages/app-core/src" || true
          echo "--- opensource/zennotes/packages/shared-domain/src ---"
          ls -la "$GITHUB_WORKSPACE/opensource/zennotes/packages/shared-domain/src" || true
          echo "--- opensource/zennotes/packages/bridge-contract/src ---"
          ls -la "$GITHUB_WORKSPACE/opensource/zennotes/packages/bridge-contract/src" || true
          echo "--- opensource/zennotes/apps/desktop/src/main (for @desktop-main alias) ---"
          ls -la "$GITHUB_WORKSPACE/opensource/zennotes/apps/desktop/src/main" || true
          echo "--- opensource/zennotes root package.json (for monorepo layout sanity) ---"
          cat "$GITHUB_WORKSPACE/opensource/zennotes/package.json" || true
          echo "--- opensource/zennotes/packages/app-core/package.json ---"
          cat "$GITHUB_WORKSPACE/opensource/zennotes/packages/app-core/package.json" || true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: build/zennotesandroid/package-lock.json

      - name: Install zennotesandroid dependencies
        working-directory: build/zennotesandroid
        run: npm install

      - name: Install zennotes monorepo dependencies
        # app-core's source is imported directly by Vite (no build step of its
        # own), but Node module resolution still walks up from the importing
        # file's location looking for node_modules - so this repo's own deps
        # (@codemirror/*, etc.) must be installed here too, or Rollup can't
        # resolve them.
        working-directory: opensource/zennotes
        run: npm install

      - name: Vite build + Capacitor sync
        working-directory: build/zennotesandroid
        run: npm run sync

      - name: Make gradlew executable
        working-directory: build/zennotesandroid/android
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: build/zennotesandroid/android
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: zennotes-debug-apk
          path: build/zennotesandroid/android/app/build/outputs/apk/debug/app-debug.apk
